# Cluster Console — production Nginx site
#
# Install as /etc/nginx/sites-available/cluster-panel and symlink into
# /etc/nginx/sites-enabled/. See deployment/README.md.
#
# The panel is protected by HTTP Basic auth at the server level, so both the
# SPA and the API (including the WebSocket handshake) require credentials.
# Replace the server_name and consider adding TLS before exposing this to the
# public internet.

# Maps the client's Upgrade header to the right Connection value for both
# WebSocket and ordinary HTTP requests. Valid here because site files are
# included in the http context.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/cluster-panel;
    index index.html;

    # Password gate. Create with: htpasswd -c /etc/nginx/.htpasswd admin
    auth_basic "Cluster Console";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Imports accept up to 10 GiB ZIP archives end to end.
    client_max_body_size 10g;

    # Long-lived WebSocket connections and multi-hour ZIP imports.
    proxy_read_timeout 6h;
    proxy_send_timeout 6h;
    proxy_connect_timeout 60s;

    # Reverse proxy the entire API surface, including /api/auth and
    # /api/v1/ws/* (WebSocket upgrades).
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket upgrade support.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream large import uploads straight through instead of buffering a
        # copy (potentially many gigabytes) on the Nginx host.
        proxy_request_buffering off;
        proxy_buffering off;

        # Preserve the request id the API emits for tracing.
        proxy_set_header X-Request-Id $request_id;
    }

    # Optional: expose liveness/readiness without the SPA rewrite.
    location = /healthz {
        proxy_pass http://127.0.0.1:3000/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /readyz {
        proxy_pass http://127.0.0.1:3000/readyz;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback: hashed assets are served directly, every other path boots
    # the React app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never serve source maps or dotfiles if they happen to be copied in.
    location ~* \.map$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/cluster-panel.access.log;
    error_log /var/log/nginx/cluster-panel.error.log;
}
