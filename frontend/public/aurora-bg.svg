<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <filter id="heavy" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="140" />
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="80" />
    </filter>
    <radialGradient id="void" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#0b1020" />
      <stop offset="60%" stop-color="#06070d" />
      <stop offset="100%" stop-color="#030409" />
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#void)" />

  <!-- Aurora ribbons: emerald, cyan, violet and a warm amber ember. -->
  <g opacity="0.55">
    <ellipse cx="260" cy="180" rx="430" ry="220" fill="#3cf5a6" filter="url(#heavy)" />
    <ellipse cx="1220" cy="120" rx="500" ry="240" fill="#a06bff" filter="url(#heavy)" />
    <ellipse cx="820" cy="880" rx="560" ry="260" fill="#35d6f5" filter="url(#heavy)" opacity="0.7" />
    <ellipse cx="1420" cy="720" rx="300" ry="180" fill="#ffb84d" filter="url(#soft)" opacity="0.35" />
  </g>

  <!-- Faint horizon grid for depth. -->
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <path d="M0 640 L1600 640 M0 700 L1600 700 M0 780 L1600 780 M0 880 L1600 880" />
    <path d="M200 560 L-200 1000 M520 560 L280 1000 M840 560 L840 1000 M1160 560 L1400 1000 M1480 560 L1720 1000" />
  </g>

  <!-- Subtle vignette. -->
  <rect width="1600" height="1000" fill="#000000" opacity="0.28" />
</svg>
