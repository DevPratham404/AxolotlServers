[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["AxolotlServers"]

[workspace.dependencies]
# --- shared ---
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
dotenvy = "0.15"
rand = "0.9"
uuid = { version = "1.29", features = ["v7", "serde"] }
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }

# --- async runtime / http ---
tokio = { version = "1.54", features = ["full"] }
axum = { version = "0.8.9", features = ["ws", "macros", "multipart"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "request-id", "cors", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
bytes = "1"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

# --- crypto (daemon auth) ---
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"

# --- outbound HTTP from the control plane ---
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }

# --- persistence / auth ---
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "sqlite-bundled",
  "migrate",
  "macros",
  "derive",
  "uuid",
  "time",
] }
jsonwebtoken = { version = "11.1", default-features = false, features = ["use_pem", "rust_crypto"] }
argon2 = "0.6"

# --- docker ---
bollard = "0.21"

# --- internal ---
cluster-shared = { path = "crates/shared" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
todo = "warn"
